name: Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Name, avatar and profile summary
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: P-Bao
          template: classic
          base: header
          filename: metrics.header.svg
          config_timezone: Asia/Ho_Chi_Minh

      # 3D contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: P-Bao
          template: classic
          base: ""
          filename: metrics.isocalendar.svg
          config_timezone: Asia/Ho_Chi_Minh
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # Most-used languages (notebooks ignored so the Python work isn't hidden behind Jupyter's byte count)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: P-Bao
          template: classic
          base: ""
          filename: metrics.languages.svg
          config_timezone: Asia/Ho_Chi_Minh
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 6
          plugin_languages_ignored: Jupyter Notebook

      # LeetCode progress. Last step on purpose: a wrong LeetCode username only fails this one.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: P-Bao
          template: classic
          base: ""
          filename: metrics.leetcode.svg
          config_timezone: Asia/Ho_Chi_Minh
          plugin_leetcode: yes
          plugin_leetcode_user: P_Bao
          plugin_leetcode_sections: solved, skills
          plugin_leetcode_limit_skills: 6
